<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060A18">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <title>PRISMA | Múltiplas visões, uma direção</title>

  <link rel="icon" type="image/svg+xml" href="../ASSETS/prisma-icone.svg">
  <link rel="preload" as="image" href="../ASSETS/prisma-robo.png">
  <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>
  <!-- Feixes de luz atrás do robô (desenhados no prisma-luz.js) -->
  <canvas class="luz-fundo" id="luzFundo" aria-hidden="true"></canvas>
  <canvas class="luz-brilho" id="luzBrilho" aria-hidden="true"></canvas>
  <div class="piso" aria-hidden="true"></div>

  <main class="cena" id="cena">

    <!-- ROBÔ PRISMA -->
    <section class="lado-robo" aria-label="PRISMA, assistente do sistema">

      <div class="balao" id="balao" aria-live="polite">
        <span id="balaoTexto">Olá, seja bem-vindo(a)! Acesse o <b>PRISMA</b> e centralize múltiplas visões em uma única direção.</span>
      </div>

      <div class="robo-area">
        <!-- pirâmides de cristal: uma ao fundo (atrás do robô) e outra na frente -->
        <svg class="piramide piramide-tras" viewBox="0 0 120 120" aria-hidden="true"><use href="#modeloPiramide"/></svg>
        <svg class="piramide piramide-frente" viewBox="0 0 120 120" aria-hidden="true"><use href="#modeloPiramide"/></svg>

        <div class="robo" id="robo">
          <img
            class="robo-img"
            src="../ASSETS/prisma-robo.png"
            alt="PRISMA, robô branco com visor escuro e um prisma de cristal na cabeça e no peito"
            width="800"
            height="1200"
            draggable="false"
          >

          <!-- Rosto e brilho do peito, nas mesmas coordenadas da imagem original (1024 × 1536) -->
          <svg class="robo-camada" viewBox="0 0 1024 1536" aria-hidden="true">
            <defs>
              <clipPath id="clipVisor">
                <path d="M375 268 L340 288 L323 315 L310 345 L305 375 L305 405 L309 425 L315 445 L324 465 L336 485 L354 505 L382 525 L428 545 L495 565 L560 576 L640 574 L690 558 L714 535 L731 505 L742 475 L748 445 L749 405 L746 385 L740 365 L730 345 L714 325 L691 305 L656 285 L612 270 L560 262 L480 262 L420 264 Z"/>
              </clipPath>

              <radialGradient id="gradVisorErro" cx="0.5" cy="0.55" r="0.6">
                <stop offset="0" stop-color="#FF3355" stop-opacity="0.55"/>
                <stop offset="0.7" stop-color="#7A0F24" stop-opacity="0.55"/>
                <stop offset="1" stop-color="#2A0510" stop-opacity="0.35"/>
              </radialGradient>

              <radialGradient id="gradAura" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
                <stop offset="0.25" stop-color="#9FF6FF" stop-opacity="0.6"/>
                <stop offset="0.6" stop-color="#8F6BFF" stop-opacity="0.18"/>
                <stop offset="1" stop-color="#8F6BFF" stop-opacity="0"/>
              </radialGradient>

              <linearGradient id="gradPeito" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#00E5FF"/>
                <stop offset="0.45" stop-color="#B9A4FF"/>
                <stop offset="1" stop-color="#FFB25C"/>
              </linearGradient>

              <filter id="brilhoRosto" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="7" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>

              <filter id="desfoquePeito" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="14"/>
              </filter>
            </defs>

            <!-- Visor: tinta vermelha do erro -->
            <g clip-path="url(#clipVisor)">
              <rect class="visor-erro" x="290" y="250" width="470" height="340" fill="url(#gradVisorErro)"/>

              <!-- Rosto (olhos e boca). O grupo #rostoOlhar anda para seguir o cursor. -->
              <g class="rosto" filter="url(#brilhoRosto)">
                <g id="rostoOlhar">
                  <!-- olhos abertos (padrão), piscam com scaleY -->
                  <g class="exp exp-normal">
                    <g class="olho-piscar" transform="translate(462 382)"><rect x="-29" y="-42" width="58" height="84" rx="29"/></g>
                    <g class="olho-piscar" transform="translate(664 396) scale(0.92)"><rect x="-29" y="-42" width="58" height="84" rx="29"/></g>
                  </g>
                  <!-- feliz: arcos, como na imagem oficial -->
                  <g class="exp exp-feliz traco">
                    <path transform="translate(462 386)" d="M-48 16 Q0 -44 48 16"/>
                    <path transform="translate(664 400) scale(0.92)" d="M-48 16 Q0 -44 48 16"/>
                  </g>
                  <!-- triste: pálpebra caída para fora -->
                  <g class="exp exp-triste">
                    <path transform="translate(462 392)" d="M-32 -6 L28 -34 Q34 -36 34 -28 L34 18 Q34 42 0 42 Q-34 42 -34 18 L-34 -2 Q-34 -6 -32 -6 Z"/>
                    <path transform="translate(664 404) scale(-0.92 0.92)" d="M-32 -6 L28 -34 Q34 -36 34 -28 L34 18 Q34 42 0 42 Q-34 42 -34 18 L-34 -2 Q-34 -6 -32 -6 Z"/>
                  </g>
                  <!-- discreto: olhos fechados enquanto digita a senha -->
                  <g class="exp exp-discreto traco">
                    <path transform="translate(462 392)" d="M-38 0 Q0 18 38 0"/>
                    <path transform="translate(664 404) scale(0.92)" d="M-38 0 Q0 18 38 0"/>
                  </g>

                  <g class="boca" id="rostoBoca">
                    <path class="exp exp-normal traco" transform="translate(562 478)" d="M-26 -4 Q0 18 26 -4"/>
                    <path class="exp exp-feliz traco" transform="translate(562 476)" d="M-38 -10 Q0 34 38 -10"/>
                    <path class="exp exp-triste traco" transform="translate(562 488)" d="M-32 14 Q0 -14 32 14"/>
                    <path class="exp exp-discreto traco" transform="translate(562 480)" d="M-18 0 Q0 8 18 0"/>
                  </g>
                </g>
              </g>
            </g>

            <!-- Prisma do peito: acende quando a luz entra -->
            <g class="peito" id="peito">
              <circle class="peito-aura" cx="514" cy="772" r="210" fill="url(#gradAura)"/>
              <path class="peito-luz" d="M517 675 L407 820 L617 820 Z" fill="url(#gradPeito)" filter="url(#desfoquePeito)"/>
              <path class="peito-nucleo" d="M520 722 L482 790 L564 790 Z" fill="#FFFFFF"/>
            </g>
          </svg>
        </div>

        <img class="robo-reflexo" src="../ASSETS/prisma-robo.png" alt="" width="800" height="1200" draggable="false" aria-hidden="true">
      </div>
    </section>

    <!-- CARTÃO DE LOGIN -->
    <section class="cartao" id="painelLogin" aria-labelledby="tituloLogin">

      <header class="marca">
        <!-- Logo PRISMA (inspirada na logo do autor): faixas de luz entram no prisma de vidro e sai a seta laranja -->
        <svg class="marca-logo" viewBox="0 0 164 110" aria-hidden="true">
          <defs>
            <linearGradient id="lgRoxo" x1="0" x2="1"><stop offset="0" stop-color="#7B4DFF" stop-opacity=".15"/><stop offset="1" stop-color="#9B6BFF"/></linearGradient>
            <linearGradient id="lgAzul" x1="0" x2="1"><stop offset="0" stop-color="#2F5BFF" stop-opacity=".2"/><stop offset="1" stop-color="#3D7BFF"/></linearGradient>
            <linearGradient id="lgCiano" x1="0" x2="1"><stop offset="0" stop-color="#00D9FF" stop-opacity=".2"/><stop offset="1" stop-color="#7DF9FF"/></linearGradient>
            <linearGradient id="lgLaranja" x1="0" x2="1"><stop offset="0" stop-color="#FF8A2B" stop-opacity=".2"/><stop offset="1" stop-color="#FFB648"/></linearGradient>
            <linearGradient id="lgVidro" x1="0.3" y1="0" x2="0.6" y2="1">
              <stop offset="0" stop-color="#8FE6FF" stop-opacity=".55"/>
              <stop offset=".5" stop-color="#2A64E0" stop-opacity=".75"/>
              <stop offset="1" stop-color="#0D2A86" stop-opacity=".9"/>
            </linearGradient>
            <linearGradient id="lgContorno" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#9EEBFF"/>
              <stop offset=".45" stop-color="#FFFFFF"/>
              <stop offset="1" stop-color="#FFB45C"/>
            </linearGradient>
            <linearGradient id="lgSeta" x1="0" x2="1"><stop offset="0" stop-color="#FFF1D6"/><stop offset=".4" stop-color="#FFB648"/><stop offset="1" stop-color="#FF7A1A"/></linearGradient>
            <radialGradient id="lgClarao" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFD58A" stop-opacity=".8"/><stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/></radialGradient>
          </defs>

          <!-- faixas de luz entrando -->
          <path d="M0 16 C20 22 42 42 64 60 L64 65 C42 50 18 32 0 28 Z" fill="url(#lgRoxo)"/>
          <path d="M0 34 C22 38 44 52 64 61 L64 66 C44 58 20 50 0 48 Z" fill="url(#lgAzul)"/>
          <path d="M0 52 C24 54 46 59 64 62 L64 67 C46 65 22 65 0 67 Z" fill="url(#lgCiano)"/>
          <path d="M0 72 C22 70 46 67 64 64 L64 69 C46 73 22 81 0 86 Z" fill="url(#lgLaranja)"/>
          <path d="M6 94 C26 86 46 75 64 66 L64 70 C46 80 28 94 10 102 Z" fill="url(#lgRoxo)"/>

          <!-- prisma de vidro -->
          <path d="M80 8 L32 100 L128 100 Z" fill="url(#lgVidro)"/>
          <path d="M80 30 L54 92 L106 92 Z" fill="#0B2470" fill-opacity=".55" stroke="#BFEFFF" stroke-opacity=".35" stroke-width="1"/>
          <path d="M80 8 L54 92 M80 8 L106 92" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="1"/>
          <path d="M80 8 L32 100 L128 100 Z" fill="none" stroke="url(#lgContorno)" stroke-width="4" stroke-linejoin="round"/>

          <!-- luz atravessando o prisma -->
          <path d="M64 64 L112 58" stroke="#E9FDFF" stroke-width="3" stroke-linecap="round"/>
          <path d="M64 64 L112 58" stroke="#7DF9FF" stroke-opacity=".45" stroke-width="8" stroke-linecap="round"/>
          <circle cx="112" cy="58" r="14" fill="url(#lgClarao)"/>

          <!-- seta saindo -->
          <path d="M112 58 C124 56 136 54 146 52" stroke="url(#lgSeta)" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M144 42 L162 51 L145 61 L149 51 Z" fill="#FF8A2B" stroke="#FFD9A3" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>

        <span class="marca-divisor" aria-hidden="true"></span>

        <div class="marca-texto">
          <strong class="marca-nome">PRISMA<svg class="marca-curva" viewBox="0 0 60 18" aria-hidden="true"><path d="M2 16 C16 16 22 4 36 4 C44 4 52 7 58 9 C50 9 44 8 38 10 C26 13 22 18 2 16 Z" fill="#FF9A3C"/></svg></strong>
          <span class="marca-sub">Múltiplas visões, uma direção.</span>
          <span class="marca-barra" aria-hidden="true"></span>
        </div>

        <span class="status-sistema"><i></i> Online</span>
      </header>

      <div class="titulo">
        <p class="sobretitulo">Central de indicadores</p>
        <h1 id="tituloLogin">Acesse o Prisma</h1>
        <p class="subtitulo">Acesse com o seu e-mail corporativo e senha já cadastrada.</p>
      </div>

      <form id="formLogin" novalidate autocomplete="on">
        <div class="campo">
          <label for="email">E-mail</label>
          <div class="campo-caixa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="username" spellcheck="false" autocapitalize="off" maxlength="254" required placeholder="nome@empresa.com.br">
          </div>
        </div>

        <div class="campo">
          <div class="campo-topo">
            <label for="senha">Senha</label>
            <button class="link" type="button" id="esqueciSenha">Esqueci minha senha</button>
          </div>
          <div class="campo-caixa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input id="senha" name="senha" type="password" autocomplete="current-password" maxlength="128" required placeholder="Sua senha">
            <button class="mostrar-senha" type="button" id="mostrarSenha" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="ico-olho" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="ico-olho-fechado" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>

        <p class="aviso" id="aviso" role="alert" aria-live="assertive"></p>

        <button class="botao-entrar" id="botaoEntrar" type="submit">
          <span>Entrar</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>

        <button class="link link-teste" type="button" id="acessoTeste">Usar acesso de teste</button>
      </form>

      <footer class="rodape">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Acesso restrito a colaboradores autorizados.</span>
      </footer>
    </section>
  </main>

  <!-- Seta de luz e clarão da transição (acima de tudo) -->
  <canvas class="luz-frente" id="luzFrente" aria-hidden="true"></canvas>

  <!-- Modelo da pirâmide de cristal do piso -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- faces do cristal -->
      <linearGradient id="pirFaceE" x1="0.2" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#CFE8FF" stop-opacity=".95"/>
        <stop offset=".35" stop-color="#3D8BFF" stop-opacity=".82"/>
        <stop offset=".75" stop-color="#1F4FE0" stop-opacity=".8"/>
        <stop offset="1" stop-color="#0D2A86" stop-opacity=".88"/>
      </linearGradient>
      <linearGradient id="pirFaceD" x1="0.8" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#FFE2B0" stop-opacity=".95"/>
        <stop offset=".35" stop-color="#FF9A3C" stop-opacity=".85"/>
        <stop offset=".7" stop-color="#C2611A" stop-opacity=".8"/>
        <stop offset="1" stop-color="#6E3A1A" stop-opacity=".88"/>
      </linearGradient>
      <!-- faixa de luz refratada dentro do cristal (azul → creme → laranja) -->
      <linearGradient id="pirArco" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1F4FE0"/>
        <stop offset=".3" stop-color="#6FB0FF"/>
        <stop offset=".55" stop-color="#FFE2B0"/>
        <stop offset=".8" stop-color="#FF9A3C"/>
        <stop offset="1" stop-color="#C2611A"/>
      </linearGradient>
      <radialGradient id="pirNucleo" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
        <stop offset=".4" stop-color="#FFE8C8" stop-opacity=".5"/>
        <stop offset="1" stop-color="#FFE8C8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="pirChao" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#A8D4FF" stop-opacity=".7"/>
        <stop offset=".45" stop-color="#3D8BFF" stop-opacity=".3"/>
        <stop offset=".75" stop-color="#FF8A2B" stop-opacity=".14"/>
        <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
      </radialGradient>
      <!-- reflexo que passa pelas faces de tempos em tempos -->
      <linearGradient id="pirReflexo" x1="0" y1="0" x2="1" y2="0.35">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"/>
        <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        <animateTransform attributeName="gradientTransform" type="translate" values="-1.2 0; 1.2 0; 1.2 0" keyTimes="0; 0.45; 1" dur="5s" repeatCount="indefinite"/>
      </linearGradient>
      <clipPath id="pirFaces"><path d="M60 8 L8 92 L70 108 L114 88 Z"/></clipPath>
      <filter id="pirDesfoque" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>

      <g id="modeloPiramide">
        <ellipse cx="62" cy="104" rx="62" ry="11" fill="url(#pirChao)" filter="url(#pirDesfoque)"/>
        <path d="M60 8 L8 92 L70 108 Z" fill="url(#pirFaceE)"/>
        <path d="M60 8 L70 108 L114 88 Z" fill="url(#pirFaceD)"/>
        <g clip-path="url(#pirFaces)">
          <path d="M8 66 L114 54 L114 62 L8 76 Z" fill="url(#pirArco)" opacity=".45"/>
          <ellipse cx="62" cy="72" rx="24" ry="20" fill="url(#pirNucleo)"/>
          <rect x="0" y="0" width="120" height="120" fill="url(#pirReflexo)"/>
        </g>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 92 L70 108 L114 88" stroke="#E9FBFF" stroke-opacity=".7" stroke-width="1.2"/>
          <path d="M60 8 L114 88" stroke="#FFE2B8" stroke-opacity=".75" stroke-width="1.3"/>
          <path d="M60 8 L8 92" stroke="#CFE8FF" stroke-opacity=".9" stroke-width="1.5"/>
          <path d="M60 8 L70 108" stroke="#FFFFFF" stroke-width="1.8"/>
        </g>
        <circle cx="60" cy="9" r="2.6" fill="#FFFFFF"/>
      </g>
    </defs>
  </svg>

  <script src="../JAVA/prisma-robo.js"></script>
  <script src="../JAVA/prisma-luz.js"></script>
  <script src="../JAVA/som-prisma.js"></script>
  <script src="../JAVA/login.js"></script>
</body>
</html>
